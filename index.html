<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
/* layout: one screen at a time, each holding only what that step needs. First the image categories, the two levels, the
   session length and Start. Then a segment, step by step: the image window with the phrase under it, the spheres, the box the phrase is
   rewritten in (under the image window too, if images are set to run during recall), and the review, which sets the
   root phrase against the rewrite, shows what each word and mark earned and waits for the next segment to be asked for. After the last segment, the three averages. The page has no color
   of its own: color belongs to the images and the spheres, and in the review to what lost points. */
:root {
  --paper: #000000; --paper-raised: #111111; --ink: #f0f0f0; --ink-soft: #9a9a9a;
  --grid: #5a5a5a; --grid-faint: #242424; --pick: #ffffff; --bad: #ff8b7a; --part: #f0e442; --good: #6ddc8f;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --phrase-size: clamp(16px, .9vw + 9px, 21px);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
[hidden] { display: none !important; }
main { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; padding: 28px 20px; overflow: auto; }

/* ---- before a session: the image categories, the two levels, the session length, Start ---- */
.setup { display: flex; flex-direction: column; gap: 28px; width: min(100%, 380px); }
/* the image categories: five round buttons in a row, each a symbol over its name; any number from one to five can be
   on at once, and those that are on are filled */
.modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mode { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.mode input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.disc { display: grid; place-items: center; width: min(100%, 56px); aspect-ratio: 1; border: 1.5px solid var(--ink); border-radius: 50%; }
.disc svg { display: block; width: 68%; height: auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.disc svg .solid { fill: currentColor; stroke: none; }
.disc svg text { fill: currentColor; stroke: none; font-family: var(--font-mono); font-weight: 700; font-size: 8.5px; letter-spacing: -.2px; }
.mode .name { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--ink-soft); }
.mode input:checked ~ .disc { background: var(--ink); color: var(--paper); }
.mode input:checked ~ .name { color: var(--ink); }
.mode input:focus-visible ~ .disc { outline: 2px solid var(--pick); outline-offset: 3px; }
.param { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.levels { display: grid; grid-template-columns: repeat(2, 1fr); border: 1.5px solid var(--ink); }
.levels label { position: relative; display: block; }
.levels label + label { border-left: 1.5px solid var(--ink); }
.levels input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.levels span { display: block; padding: 9px 0; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.levels input:checked + span { background: var(--ink); color: var(--paper); }
.levels.two { grid-template-columns: repeat(2, 1fr); }     /* two boxes, for a setting that is only off or on */
/* A level is set by dragging a square along a line; the square shows the level it stands on. The square and the line
   are drawn here, and a range input lies unseen over them, so dragging, tapping the line and the arrow keys all work. */
.slide { position: relative; height: 44px; --at: 0; }
.slide::before { content: ""; position: absolute; left: 22px; right: 22px; top: calc(50% - .75px); border-top: 1.5px solid var(--ink); }
.slide .tick { position: absolute; top: calc(50% - 5px); left: calc(22px + var(--i) * (100% - 44px)); width: 1.5px; height: 10px; margin-left: -.75px; background: var(--ink); }
.slide input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: grab; -webkit-appearance: none; appearance: none; touch-action: pan-y; }
.slide input:active { cursor: grabbing; }
.slide input::-webkit-slider-thumb { -webkit-appearance: none; width: 44px; height: 44px; }
.slide input::-moz-range-thumb { width: 44px; height: 44px; border: 0; }
.slide .knob { position: absolute; top: 0; left: calc(var(--at) * (100% - 44px)); display: grid; place-items: center; width: 44px; height: 44px; background: var(--ink); color: var(--paper);
  font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; pointer-events: none; transition: left .1s ease; }
.slide input:focus-visible ~ .knob { outline: 2px solid var(--pick); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .slide .knob { transition: none; } }
.levels.two span { font-size: 16px; letter-spacing: .12em; text-transform: uppercase; }
.levels input:focus-visible + span { outline: 2px solid var(--pick); outline-offset: 2px; }
/* the two times, side by side at the top: large bold digits typed straight onto the page with no box around them,
   each followed by its unit. A field is exactly as wide as what is typed in it (fitTime below). */
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 16px; }
.pair .param { display: grid; grid-row: span 2; grid-template-rows: subgrid; row-gap: 10px; }   /* the two names on one line, the two numbers on the next */
.pair .param .eyebrow { align-self: end; }
.mins.big { align-items: baseline; gap: 6px; min-width: 0; }
.mins.big input { flex: none; width: 2ch; min-width: 1ch; max-width: 100%; padding: 0; text-align: left; background: none; border: 0; border-bottom: 1.5px solid transparent; border-radius: 0;
  font-family: var(--font-display); font-weight: 700; font-size: clamp(50px, 15vw, 76px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); -moz-appearance: textfield; appearance: textfield; }
.mins.big input::-webkit-outer-spin-button, .mins.big input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.mins.big input:hover { border-bottom-color: var(--grid); }
.mins.big input::placeholder { color: var(--grid); opacity: 1; }
.mins.big input:focus { outline: none; border-bottom-color: var(--ink-soft); }
.mins.big input:focus-visible { outline: none; border-bottom-color: var(--pick); }
.mins.big span { font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 6vw, 26px); color: var(--ink-soft); }
.mins { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); }
.mins input { width: 88px; padding: 9px 10px; text-align: right; background: var(--paper-raised); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 0; font-family: var(--font-mono); font-size: 16px; }
.act { padding: 8px 14px; border: 1.5px solid var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.act.main { background: var(--ink); color: var(--paper); }
.setup .act { padding: 12px 14px; font-size: 18px; }
#go { background: var(--good); border-color: var(--good); color: var(--paper); }   /* Start is the one green thing on the first screen */
@media (hover: hover) {
  .act:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .act.main:hover { background: color-mix(in srgb, var(--ink) 82%, var(--paper)); }
  #go:hover { background: color-mix(in srgb, var(--good) 84%, var(--paper)); }
  .levels input:hover:not(:checked) + span { background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .mode input:hover:not(:checked) ~ .disc { background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .quit:hover { color: var(--ink); }
}
/* said only when the page cannot find its images or its text */
.note { font-size: 13.5px; color: var(--ink-soft); }
.note:empty { display: none; }

/* ---- during a session: the one way out, in the corner ---- */
.quit { position: absolute; top: 12px; right: 14px; padding: 8px 10px; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.wait { font-size: 15px; color: var(--ink-soft); }

/* step 1: the image window, a square each picture is cropped and scaled to fill; under it the time left, as a bar
   draining with the seconds counted down beside it; the phrase under that, and under the phrase its footnote. Phrase
   and footnote together keep room for four lines and the footnote, so the window sits in the same place every
   segment. The window is as large as leaves room for all of that and for the strip at the foot of the screen. */
.memo { display: flex; flex-direction: column; align-items: center; width: 100%; }
.frame { width: min(100%, 560px, max(200px, 100vh - 6.2 * var(--phrase-size) - 204px)); width: min(100%, 560px, max(200px, 100dvh - 6.2 * var(--phrase-size) - 204px)); }
.window { aspect-ratio: 1; overflow: hidden; background: var(--paper-raised); border: 1px solid var(--grid); user-select: none; -webkit-user-select: none; }
.window img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.timing { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.fuse { flex: 1; height: 3px; background: var(--grid-faint); }
.fuse i { display: block; height: 100%; background: var(--ink); transform-origin: 0 50%; }
.count { min-width: 4ch; font-family: var(--font-mono); font-weight: 500; font-size: 14px; line-height: 1; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; }
.phrase, .reply textarea { font-family: var(--font-mono); font-weight: 500; font-size: var(--phrase-size); line-height: 1.55; }
.told { display: flex; flex-direction: column; align-items: center; width: 100%; min-height: calc(6.2 * var(--phrase-size) + 48px); margin-top: 18px; }
.phrase { max-width: min(100%, 44em); text-align: center; text-wrap: balance; user-select: none; -webkit-user-select: none; }
/* the footnote: the text a phrase refers to and its author, set off from the phrase by a short rule as a footnote is
   in print; it is not part of what has to be rewritten */
.source { font-size: 15px; line-height: 1.35; color: var(--ink-soft); }
.source cite { font-style: italic; }
.memo .source { position: relative; max-width: min(100%, 44em); margin-top: 12px; padding-top: 11px; text-align: center; text-wrap: balance; user-select: none; -webkit-user-select: none; }
.memo .source::before { content: ""; position: absolute; top: 0; left: 50%; width: 44px; margin-left: -22px; border-top: 1px solid var(--grid); }

/* step 2: the spheres, nine across and five down; each button is a whole cell, so the press need not be exact */
.field { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(5, 1fr); aspect-ratio: 9 / 5; width: min(100%, 900px, (100vh - 150px) * 9 / 5); width: min(100%, 900px, (100dvh - 150px) * 9 / 5); user-select: none; -webkit-user-select: none; }
.orb { display: grid; place-items: center; min-width: 0; min-height: 0; touch-action: manipulation; }
.ball { width: 60%; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 2px 5px rgb(0 0 0 / .45); }
.orb.a .ball { background: radial-gradient(circle at 36% 30%, var(--a-hi), var(--a-mid) 48%, var(--a-lo)); }
.orb.b .ball { background: radial-gradient(circle at 36% 30%, var(--b-hi), var(--b-mid) 48%, var(--b-lo)); }
.orb:focus-visible { outline: none; }
.orb:focus-visible .ball { outline: 2px dotted var(--ink-soft); outline-offset: 5px; }
.orb.picked .ball { outline: 2px solid var(--pick); outline-offset: 3px; }
.orb.off .ball { outline: 2px dashed var(--bad); outline-offset: 3px; animation: nope .4s ease; }
@keyframes nope { 20% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }

/* step 3: the box, alone on the screen, or under the image window when images are set to run during recall too */
.reply { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; width: min(100%, 760px); }
.frame:not([hidden]) ~ .reply { margin-top: 18px; }
.reply textarea { display: block; width: 100%; height: 5.4em; max-height: 60vh; resize: none; padding: 10px 12px; background: var(--paper-raised); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 0; }
.reply textarea:focus-visible { outline-offset: -2px; }

/* the review of a segment: both phrases on the left, the root phrase with its cues marked held or lost; on the right
   the comprehension, how many cues of each kind were held and the button that starts the next segment */
.score, .figures dd { font-family: var(--font-display); font-weight: 700; line-height: .92; white-space: nowrap; font-variant-numeric: tabular-nums; }
.review { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: auto auto 1fr; grid-template-areas: "said score" "said sums" "said next"; gap: 22px 48px; align-items: start; width: min(100%, 1080px); }
.mark { grid-area: score; display: flex; flex-direction: column; gap: 8px; }
.score { font-size: clamp(72px, 9vw, 128px); }
/* a comprehension score wears its band: low in red, mid in yellow, high in green, with the word beside the number */
.low { color: var(--bad); }
.mid { color: var(--part); }
.high { color: var(--good); }
.band { margin-left: .3em; font-size: .3em; font-weight: 600; letter-spacing: .1em; }
.said { grid-area: said; display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.tally-wrap { grid-area: sums; }
.go-on { grid-area: next; }
.go-on .act { width: 100%; padding: 12px 14px; font-size: 18px; }
.clock { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
/* said only when the difficulty has just moved: which way, and the two levels it moved to */
.where { font-family: var(--font-mono); font-weight: 500; font-size: 15px; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.shown { display: flex; flex-direction: column; gap: 10px; }
.shown .eyebrow { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.eyebrow .aside { font-family: var(--font-mono); font-weight: 400; font-size: 12.5px; letter-spacing: 0; text-transform: none; }
.toks { font-family: var(--font-mono); font-weight: 500; font-size: clamp(15px, .5vw + 10px, 18px); line-height: 1.25; }
.unit { display: inline-block; white-space: nowrap; }
.tok { display: inline-block; margin: 0 1px 12px; text-align: center; vertical-align: top; }
.tok b, .tok i { display: block; font-weight: 500; font-style: normal; }
.tok b { min-width: 1.2ch; }
.tok i { margin-top: 4px; font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.none { color: var(--ink-soft); }
.said-text { font-family: var(--font-mono); font-weight: 500; font-size: clamp(15px, .5vw + 10px, 18px); line-height: 1.5; }
.ideas { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 14px; font-family: var(--font-mono); font-size: 14px; line-height: 1.3; }
.ideas:empty { display: none; }
/* The root phrase with its cues marked. Words that are not cues stand back; a cue held is bright, and bold when it
   is a name or a noun; a cue lost is struck through in red; a detail recalled without what it describes is yellow. */
.said-text.cued { color: var(--ink-soft); }
.cue { font-weight: 500; color: var(--ink); }
.cue.heavy { font-weight: 700; }
.cue.loose { color: var(--part); text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.heard { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }   /* said to a screen reader, not shown */
.cue.lost { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.shown .source { margin-top: -6px; }
/* how a token fared is carried by its mark as well as its color, and by the points under it */
.s-case, .s-near, .s-moved, .tok i.s-case, .tok i.s-near, .tok i.s-moved { color: var(--part); }
.s-gone, .s-alone, .s-extra, .tok i.s-gone, .tok i.s-alone, .tok i.s-extra { color: var(--bad); }
b.s-case, b.s-near, b.s-moved { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
b.s-near { text-decoration-style: wavy; text-decoration-thickness: 1.5px; }
b.s-moved { text-decoration-style: dotted; }
b.s-gone { text-decoration: line-through; text-decoration-thickness: 2px; }
.tally { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13.5px; }
.tally td:first-child { white-space: nowrap; }
.tally td { padding: 6px 0; border-top: 1px solid var(--grid-faint); vertical-align: baseline; }
.tally b { font-weight: 500; }
.tally tr:last-child td { border-bottom: 1px solid var(--grid-faint); }
.tally td:last-child { padding-left: 14px; text-align: right; white-space: nowrap; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.results { display: flex; flex-direction: column; align-items: center; gap: clamp(36px, 8vh, 72px); width: 100%; }
.figures { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 30px clamp(30px, 7vw, 96px); text-align: center; }
.figures div { display: flex; flex-direction: column-reverse; gap: 8px; }                /* the figure above its name */
.figures dd { font-size: clamp(44px, 7vw, 84px); }
.figures .hero dd { font-size: clamp(88px, 16vw, 190px); }
.wrap-up { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.wrap-up .clock { margin: 0; gap: 16px; }

/* ---- during a session, at the foot of the screen: the difficulty in force and, beside it, the session timer ---- */
.status { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 40px; padding: 6px 20px 14px; }
.stat { display: flex; align-items: baseline; gap: 10px; }
.stat .eyebrow { font-size: 13px; }

/* a narrow window stacks the review in reading order, and keeps the button for the next segment in reach at the foot */
@media (max-width: 900px) {
  .review { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "score" "said" "sums" "next"; }
  .go-on { position: sticky; bottom: -28px; padding: 12px 0 28px; background: var(--paper); }
}
/* a short window: the first screen draws in a little, so that Start stays in view */
@media (max-height: 700px) {
  .setup { gap: 20px; }
  .disc { width: min(100%, 48px); }
}
@media (max-width: 560px) {
  main { padding: 20px 14px; }
  .go-on { bottom: -20px; padding-bottom: 20px; }
  :root { --phrase-size: 16px; }                 /* 16px, so a phone does not zoom the page when the box is tapped */
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main>
  <div class="setup" id="setup">
    <div class="param">
      <span class="eyebrow" id="modes-name">Stimuli types</span>
    <div class="modes" id="modes" role="group" aria-labelledby="modes-name">
      <label class="mode">
        <input type="checkbox" name="kind" value="cute" checked>
        <span class="disc"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 11.5c0-3 2.3-5 5-5s5 2 5 5v6.5c0 4-2.3 6.5-5 6.5s-5-2.5-5-6.5z"/><path class="solid" d="M11.4 9.4C9 8.2 5 9.3 4.4 13.4c-.4 3 1.2 6.1 3.3 6.1 1.5 0 2.7-2 3.3-4.1z"/><path class="solid" d="M20.6 9.4c2.4-1.2 6.4-.1 7 4 .4 3-1.2 6.1-3.3 6.1-1.5 0-2.7-2-3.3-4.1z"/><circle class="solid" cx="13.8" cy="14.6" r="1.2"/><circle class="solid" cx="18.2" cy="14.6" r="1.2"/><ellipse class="solid" cx="16" cy="19" rx="1.9" ry="1.3"/><path d="M14.4 21.6c.9.9 2.3.9 3.2 0"/></svg></span>
        <span class="name">Cute</span>
      </label>
      <label class="mode">
        <input type="checkbox" name="kind" value="odd">
        <span class="disc"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5L29 27H3z"/><text x="16" y="23.6" text-anchor="middle">333</text></svg></span>
        <span class="name">Odd</span>
      </label>
      <label class="mode">
        <input type="checkbox" name="kind" value="grim">
        <span class="disc"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.6C9.6 3.6 5.2 8 5.2 13.8c0 3.2 1.4 5.6 3.6 7V26c0 1.1.9 2 2 2h10.4c1.1 0 2-.9 2-2v-5.2c2.2-1.4 3.6-3.8 3.6-7C26.8 8 22.4 3.6 16 3.6z"/><path class="solid" d="M8.8 15.2c0-2 1.4-3.2 3.3-3.2s3.1 1.3 3 3c-.1 1.8-1.5 3.1-3.3 3.1-1.8 0-3-1.2-3-2.9z"/><path class="solid" d="M23.2 15.2c0-2-1.4-3.2-3.3-3.2s-3.1 1.3-3 3c.1 1.8 1.5 3.1 3.3 3.1 1.8 0 3-1.2 3-2.9z"/><path class="solid" d="M16 19l1.6 3h-3.2z"/><path d="M12.8 24.2V28M16 24.2V28M19.2 24.2V28"/></svg></span>
        <span class="name">Grim</span>
      </label>
      <label class="mode">
        <input type="checkbox" name="kind" value="sexy">

  const page = decodeURIComponent(location.pathname.split('/').pop()) || 'index.html';
  const guesses = dirs.length ? [[dirs[0], dirs.slice(1)], [dirs[0], ['docs'].concat(dirs.slice(1))]] : [];
  guesses.push([owner + '.github.io', dirs]);              // a user site: the pages are the repository <owner>.github.io
  for (const [repo, path] of guesses) {

  const lists = await Promise.all(kinds.map((k) => folderImages(imageFolder(k), fresh)));
  const data = { wanted: kinds, empty: kinds.filter((_, i) => !lists[i].length), list: [].concat(...lists), groups: lists };
  shelf.images.set(key, { at: now(), data });
  return data;
}
async function textFor(level, fresh) {
  const hit = shelf.text.get(level);

  if (body == null && SERVED && !PREVIEW) try {
    const r = await fetch(wanted, { cache: 'no-cache' });

  if (body != null) { const got = phrasesFor(level, entriesOf(body)); if (got.list.length) data = Object.assign(got, { wanted, file: wanted }); }
  if (!data) data = Object.assign(phrasesFor(level, entriesOf(SAMPLES.join('\n'))), { wanted, file: '' });

}

/* ---------- the first screen ---------- */
function drawNote() {                                      // empty unless something the page needs is missing
  const im = shelf.images.get(set.kinds.join(',')), tx = shelf.text.get(set.wm), say = [];
  if (im && im.data.empty.length) {
    const names = im.data.empty, list = names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
    if (!SERVED && !im.data.list.length) say.push('No images found beside this file, so the image window will be empty.');
    else say.push('No images found in the ' + list + ' folder' + (names.length > 1 ? 's' : '') + (im.data.list.length ? ', so ' + (names.length > 1 ? 'those categories are' : 'that category is') + ' left out.' : ', so the image window will be empty.'));
  }
  if (tx) {
    const d = tx.data, range = WM[set.wm - 1].words;
    if (!d.file) say.push((SERVED ? d.wanted + ' could not be read' : 'A page opened as a file cannot read ' + d.wanted) + ', so built-in sample phrases are used.');
    else if (d.fit < d.list.length) say.push('Only ' + d.fit + ' of the sentences in ' + d.file + ' have ' + range[0] + ' to ' + range[1] + ' words, so the ' + d.list.length + ' nearest in length are used.');
  }

}
async function survey() {
  const kinds = set.kinds.join(','), wm = set.wm;
  drawNote();
  await Promise.all([imagesFor(set.kinds), textFor(wm)]);
  if (set.kinds.join(',') === kinds && set.wm === wm) drawNote();
}
function minutesTyped() {
  const v = parseFloat($('session-min').value);
  return isFinite(v) && v > 0 ? Math.min(v, 999) : 0;
}
function draw() {                                          // one screen at a time
  const phase = run ? run.phase : view;

  $('stop').hidden = !run;
  $('wait').hidden = !(run && phase === 'loading' && run.slow);
  $('memo').hidden = phase !== 'memorize' && phase !== 'recall';
  $('frame').hidden = !(phase === 'memorize' || (phase === 'recall' && run.pics));   // the window: while memorizing, and during recall if asked for
  $('fuse-track').style.visibility = phase === 'memorize' ? '' : 'hidden';           // only memorizing is timed: the bar and its countdown
  $('told').hidden = phase !== 'memorize';
  $('phrase').hidden = phase !== 'memorize';
  $('source').hidden = phase !== 'memorize' || !$('source').firstChild;              // the footnote, when the phrase has one
  $('reply').hidden = phase !== 'recall';
  $('field').hidden = phase !== 'spheres';
  $('review').hidden = phase !== 'review';
  $('results').hidden = phase !== 'results';
  $('status').hidden = !(run && (LIVE.includes(phase) || phase === 'review'));
  drawStatus();
}
/* The strip at the foot of the screen through a session: the difficulty in force, and the session time left. The
   timer runs while a segment is being played and stands still, marked as paused, while its review is read. */
const LIVE = ['memorize', 'spheres', 'recall'];
function drawStatus() {
  const r = run;
  if (!r) return;
  const live = LIVE.includes(r.phase);
  $('status-level').textContent = levelsText(r);
  $('status-clock').textContent = live || r.time <= 0 ? 'Session' : 'Session paused';   // at 00:00 there is nothing left to pause
  $('status-time').textContent = clockText(live ? r.time - (now() - r.began) : r.time);
}

/* ---------- the image window ---------- */
const ready = new Map();                                   // address -> a decoded picture, ready to drop into the window
const loading = new Map();                                 // address -> the load in progress, so nothing is fetched twice at once
function warm(url) {
  if (ready.has(url)) return Promise.resolve(true);
  if (!loading.has(url)) loading.set(url, new Promise((done) => {
    const img = new Image();
    const end = (ok) => { loading.delete(url); if (ok) ready.set(url, img); done(ok); };
    img.alt = '';
    img.draggable = false;
    img.onload = () => { if (img.decode) img.decode().then(() => end(true), () => end(true)); else end(true); };
    img.onerror = () => end(false);
    img.src = url;
  }));
  return loading.get(url);
}
/* Which picture comes next is dealt by the session's dealer (above). The draws are made a few
   ahead of the window, so that a picture is loaded by the time it is due, but never the whole library at once: a
   folder of hundreds costs no more than a folder of ten. A picture that will not load is dropped for the session. */
const AHEAD = 5, KEPT = 24;
function deal(r) {
  const want = Math.min(AHEAD, r.deck.size);
  while (r.deck.size && r.hand.length < want) {
    const url = r.deck.next();
    r.hand.push(url);
    warm(url).then((ok) => {
      if (ok || run !== r) return;
      r.deck.drop(url);
      r.hand = r.hand.filter((u) => u !== url);
      deal(r);
    });
  }
}
async function stock(r, groups) {                          // the first few pictures are in hand before the session clock starts
  r.deck = dealer(groups);
  deal(r);
  await Promise.race([Promise.all(r.hand.map(warm)), new Promise((done) => setTimeout(done, 6000))]);
}
function nextImage(r) {
  if (r.hand.length && ready.has(r.hand[0])) {           // strictly in the order dealt: a picture still loading holds the window until it is in
    const url = r.hand.shift();
    r.showing = url;
    $('window').replaceChildren(ready.get(url));
    for (const old of ready.keys()) {                      // let go of pictures shown long ago; they load again from the browser's cache
      if (ready.size <= KEPT) break;
      if (old !== url && !r.hand.includes(old)) ready.delete(old);
    }
  }
  deal(r);
}

/* ---------- the meaning model ---------- */
/* A small sentence model (all-MiniLM-L6-v2, about 23 MB, kept in the browser's cache after the first visit), loaded
   from public CDNs in the background as soon as the page opens. Grading never waits on it for more than a few
   seconds: if it cannot load (offline, blocked, too slow), recalls are graded on the cues alone and the review
   says so. A page can also supply its own comparison as window.AXIOM_MEANING(a, b) -> cosine, which the tests use. */
const MEANING = { lib: 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3', model: 'Xenova/all-MiniLM-L6-v2', wait: 4000 };
let embedder = null;
function loadMeaning() {
  if (window.AXIOM_MEANING) return Promise.resolve(window.AXIOM_MEANING);
  if (!embedder) embedder = import(MEANING.lib)
    .then((t) => { t.env.allowLocalModels = false; return t.pipeline('feature-extraction', MEANING.model, { dtype: 'q8' }); })
    .then((pipe) => async (a, b) => {
      const [x, y] = (await pipe([a, b], { pooling: 'mean', normalize: true })).tolist();
      return x.reduce((sum, v, i) => sum + v * y[i], 0);
    })
    .catch(() => null);
  return embedder;
}
async function meaningOf(a, b) {                             // 0 to 1, or null when the model is not available
  if (!b.trim()) return 0;
  try {
    const cosine = await Promise.race([loadMeaning(), new Promise((done) => setTimeout(() => done(null), MEANING.wait))]);
    if (!cosine) return null;
    return meaningShare(await cosine(a, b));
  } catch (e) { return null; }
}
/* a recall graded: the cues it held, the meaning score, the wording score, and the comprehension they make */
function grade(entry, typed, meaning) {
  const wording = compare(entry.s, typed), checks = ideasFound(ideasOf(entry.ideas), typed);
  const value = typed.trim() ? comprehension(checks, meaning, wording.value) : 0;
  return { value, percent: percentOf(value), checks, meaning, wording };
}

/* ---------- a session ---------- */
async function start() {
  if (run) return;
  const minutes = minutesTyped(), memo = memorizeSeconds($('memo-sec').value);
  if (!memo) { $('memo-sec').focus(); return; }
  if (!minutes) { $('session-min').focus(); return; }
  const r = run = {
    kinds: set.kinds.slice(), sea: set.sea, wm: set.wm, pics: set.pics, memo,
    from: { sea: set.sea, wm: set.wm },                      // where the difficulty stood when the session began
    recent: [],                                              // the comprehension of each recall made at the present difficulty
    time: minutes * 60000, phase: 'loading', rounds: [], round: null,
    texts: new Map(), piles: new Map(),                      // per working-memory level: its phrases, and those not yet shown
    deck: null, hand: [],                                    // the dealer of the chosen categories' pictures; those dealt and loading
  };
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // so a stray Space does not press a button
  r.tick = setInterval(() => { if (run === r) drawStatus(); }, 200);   // keeps the session timer at the foot of the screen in step with the clock
  draw();
  setTimeout(() => { if (run === r && r.phase === 'loading') { r.slow = true; draw(); } }, 400);   // say so only if loading takes a moment
  const [im, phrases] = await Promise.all([imagesFor(r.kinds, true), phrasesAt(r, r.wm)]);
  if (run !== r) return;
  drawNote();
  r.phrases = phrases;
  await stock(r, im.groups);
  if (run !== r) return;
  memorize();
}
/* The phrases of a working-memory level, read once a session. The levels on either side are read along with it, so
   that when the difficulty moves the next segment does not have to wait for a file. */
function phrasesAt(r, level) {
  const read = (n) => { if (n >= 1 && n <= LEVELS && !r.texts.has(n)) r.texts.set(n, textFor(n, true).then((tx) => tx.list)); };
  read(level); read(level + 1); read(level - 1);
  return r.texts.get(level);
}
/* What happens next and when. Browsers slow the timers of a tab that is out of sight, so when the tab comes back
   anything already due is done at once instead of whenever the slowed timer gets round to it. */
function later(r, ms, then) {
  clearTimeout(r.phaseT);
  r.due = now() + ms;
  r.then = then;
  r.phaseT = setTimeout(() => { if (run === r && r.then === then) { r.then = null; then(); } }, ms);
}
document.addEventListener('visibilitychange', () => {
  const r = run;
  if (document.hidden || !r || !r.then || now() < r.due) return;
  const then = r.then;
  clearTimeout(r.phaseT);
  r.then = null;
  then();
});
function nextPhrase(r) {
  let pile = r.piles.get(r.wm);                            // every phrase of a level once before any comes round again
  if (!pile || !pile.length) r.piles.set(r.wm, pile = shuffle(r.phrases.slice()));
  let entry = pile.pop();
  if (r.round && entry.s === r.round.phrase && pile.length) { pile.unshift(entry); entry = pile.pop(); }
  return entry;
}
/* the footnote of a phrase: the title of the text it refers to, in italics, then the author */
const sourceOf = (e) => (e.title ? '<cite>' + esc(e.title) + '</cite>' : '') + (e.title && e.author ? ', ' : '') + esc(e.author || '');

/* The window changes pictures on the beat of the selective-attention level for as long as the step lasts. The beat
   is counted from the start of the step, so the rhythm cannot drift; beats missed while the tab was out of sight are
   skipped, never played back in a burst. */
function cycle(r, step, until) {
  const beat = SEA[r.sea - 1].swap * 1000, t0 = now();
  const swap = () => {
    if (run !== r || r.phase !== step || now() > until - 50) return;             // no new picture in the instant a timed step ends
    nextImage(r);
    r.swapT = setTimeout(swap, Math.max(0, t0 + (Math.round((now() - t0) / beat) + 1) * beat - now()));
  };
  clearTimeout(r.swapT);
  nextImage(r);
  r.swapT = setTimeout(swap, beat);

/* step 1: the phrase under the window, the window changing pictures, for the time the two levels allow */
function memorize() {
  const r = run, t0 = now();
  r.window = r.memo * 1000;                                // the reading window the player set
  const end = t0 + r.window;
  const entry = nextPhrase(r);
  r.round = { entry, phrase: entry.s, misses: 0, sea: r.sea, wm: r.wm };
  r.began = t0;                                            // the session clock runs from here until the rewrite is handed in
  r.phase = 'memorize';
  $('phrase').textContent = r.round.phrase;
  $('source').innerHTML = sourceOf(entry);
  draw();
  cycle(r, 'memorize', end);
  const drain = () => {                                    // the bar under the window and the seconds beside it, read off the clock each frame
    if (run !== r || r.phase !== 'memorize') return;
    const left = Math.max(0, end - now()), seconds = Math.ceil(left / 1000) + ' sec';
    $('fuse').style.transform = 'scaleX(' + left / r.window + ')';
    if ($('count').textContent !== seconds) $('count').textContent = seconds;
    r.frame = requestAnimationFrame(drain);
  };
  drain();
  later(r, r.window, spheres);
}

/* step 2: forty-five spheres in two colors; it ends when every sphere of the rarer color has been selected */
function spheres() {
  const r = run, level = SEA[r.sea - 1];
  clearTimeout(r.swapT);
  $('window').replaceChildren();
  $('phrase').textContent = '';
  $('source').replaceChildren();
  const count = level.odd[0] + randInt(level.odd[1] - level.odd[0] + 1);
  r.odd = new Set(shuffle(Array.from({ length: 45 }, (_, i) => i)).slice(0, count));
  r.left = count;
  const colors = twoColors(level.gap), names = coin() ? ['a', 'b'] : ['b', 'a'];   // which class is the rare one changes too
  const field = $('field');
  names.forEach((name, k) => { for (const part of ['hi', 'mid', 'lo']) field.style.setProperty('--' + name + '-' + part, colors[k][part]); });
  field.innerHTML = Array.from({ length: 45 }, (_, i) =>
    '<button type="button" class="orb ' + names[r.odd.has(i) ? 1 : 0] + '" data-i="' + i + '" aria-pressed="false" aria-label="Sphere, row ' + (Math.floor(i / 9) + 1) + ', column ' + (i % 9 + 1) + '"><span class="ball"></span></button>').join('');
  r.phase = 'spheres';
  draw();
  r.t0 = now();
}
function pressSphere(orb) {
  const r = run;
  if (!r || r.phase !== 'spheres' || !r.left || orb.classList.contains('picked')) return;
  if (r.odd.has(+orb.dataset.i)) {
    orb.classList.add('picked');
    orb.setAttribute('aria-pressed', 'true');
    if (--r.left === 0) {
      r.round.sphereMs = now() - r.t0;
      later(r, 350, recall);                               // long enough to see the last ring close
    }
  } else {
    r.round.misses++;
    orb.classList.remove('off');
    void orb.offsetWidth;
    orb.classList.add('off');
    setTimeout(() => orb.classList.remove('off'), 450);
  }
}

/* step 3: the box; it waits for as long as the rewrite takes, and grows so that a long rewrite stays in view whole */
function fitBox() {
  const box = $('answer');
  box.style.height = '';
  if (box.scrollHeight > box.clientHeight) box.style.height = box.scrollHeight + box.offsetHeight - box.clientHeight + 'px';
}
function recall() {
  const r = run;
  r.phase = 'recall';
  draw();
  $('answer').value = '';
  fitBox();
  if (r.pics) cycle(r, 'recall', Infinity);                // the window keeps changing over the box until the rewrite is handed in
  $('answer').focus();
  r.t0 = now();
}
async function submit() {
  const r = run;
  if (!r || r.phase !== 'recall' || r.grading) return;
  const round = r.round, typed = $('answer').value;
  round.recallMs = now() - r.t0;
  r.time -= now() - r.began;                               // only the time spent inside a segment counts against the session
  clearTimeout(r.swapT);
  $('window').replaceChildren();
  r.grading = true;                                        // the meaning model takes a moment; the box waits, and its time does not count
  $('submit').textContent = 'Grading';
  const meaning = await meaningOf(round.phrase, typed);
  r.grading = false;
  $('submit').textContent = 'Submit';
  if (run !== r) return;
  round.result = grade(round.entry, typed, meaning);
  r.rounds.push(round);
  /* the skill scalar: three recalls at this difficulty, and their average moves both levels up, down or not at all */
  r.recent.push(round.result.percent);
  const step = skillStep(r.recent), to = stepped(r.sea, r.wm, step);
  round.shift = to.sea !== r.sea || to.wm !== r.wm ? step : 0;
  if (round.shift) {
    r.sea = to.sea;
    r.wm = to.wm;
    r.recent = [];
    phrasesAt(r, r.wm);                                      // have the new level's phrases in hand by the next segment
  }

}

/* ---------- the review: the root phrase with its cues marked held or lost, the recall, the counts, and a button ---------- */
const levelsText = (at) => 'SeA ' + at.sea + ', WM ' + at.wm;
function showScore(el, percent) {                          // the percentage in the color of its band, and the band's name beside it
  const band = bandOf(percent);
  el.classList.remove('low', 'mid', 'high');
  el.classList.add(band);
  el.innerHTML = '<span class="pct">' + percent + '%</span><span class="band">' + band.toUpperCase() + '</span>';
}
const CUE = { held: 'held', loose: 'recalled, but not what it describes', lost: 'lost' };
const cueState = (c) => c.counts ? 'held' : c.found ? 'loose' : 'lost';
const cueTag = (c, text) => '<b class="cue ' + (c.kind === 'name' || c.kind === 'noun' ? 'heavy ' : '') + cueState(c) + '" title="' + c.kind + ', ' + CUE[cueState(c)] + '">' + esc(text) + '</b>';
function review(r) {
  const res = r.round.result, checks = res.checks, n = cueCounts(checks);
  const row = (label, value, cls) => '<tr><td><b' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(label) + '</b></td><td>' + esc(value) + '</td></tr>';
  const marks = cuesIn(r.round.phrase, checks), seen = new Set(marks.list.map((k) => k.cue));
  let text = '', last = 0;
  for (const k of marks.list) {                            // the root phrase, each cue in it marked by how it fared
    const word = marks.chars.slice(k.at, k.end).join('');
    text += esc(marks.chars.slice(last, k.at).join('')) + (k.cue < 0 ? esc(word) : cueTag(checks[k.cue], word));
    last = k.end;
  }
  showScore($('score'), res.percent);
  $('root-toks').innerHTML = text + esc(marks.chars.slice(last).join(''));
  $('root-toks').classList.toggle('cued', checks.length > 0);
  const told = (state, lead) => { const list = checks.filter((c) => cueState(c) === state).map((c) => c.label); return list.length ? lead + list.join(', ') + '. ' : ''; };
  $('root-heard').textContent = told('lost', 'Cues lost: ') + told('loose', 'Details recalled without what they describe: ');   // what the colors say, in words
  $('yours-toks').innerHTML = $('answer').value.trim() ? esc($('answer').value.trim()) : '<span class="none">nothing typed</span>';
  $('root-source').innerHTML = sourceOf(r.round.entry);
  $('root-source').hidden = !$('root-source').firstChild;
  $('root-worth').textContent = '';
  $('yours-worth').textContent = '';
  $('ideas').innerHTML = checks.map((c, i) => seen.has(i) ? '' : cueTag(c, c.label)).join('');   // cues the file names in words the phrase does not use
  $('tally').innerHTML = [['name', 'Names'], ['noun', 'Nouns'], ['detail', 'Details'], ['verb', 'Verbs']]
    .map(([kind, label]) => n[kind].of ? row(label, n[kind].held + ' of ' + n[kind].of) + (kind === 'detail' && n.loose ? row('Details without their noun', n.loose, 'cue loose') : '') : '').join('')
    + row('Meaning match', res.meaning == null ? 'not available' : percentOf(res.meaning) + '%')
    + row('Wording accuracy', res.wording.percent + '%');
  $('shift').hidden = !r.round.shift;                      // said only when this recall has just moved the difficulty
  $('shift-way').textContent = r.round.shift > 0 ? 'Difficulty raised' : 'Difficulty lowered';
  $('shift-to').textContent = levelsText(r);
  $('next').textContent = r.time > 0 ? 'Start next segment' : 'View session results';   // nothing moves on until this is pressed
  r.phase = 'review';
  r.shownAt = now();
  draw();
  $('review').parentNode.scrollTop = 0;
}
async function onward() {
  const r = run;
  if (!r || r.phase !== 'review' || r.fetching) return;
  if (r.time <= 0) { finish(); return; }                   // when the session time is used up, the segment just reviewed was the last
  r.fetching = true;                                       // in hand already, unless the level has just moved and its file is slow to arrive
  let phrases = r.phrases;
  try { phrases = await phrasesAt(r, r.wm); } catch (e) { /* keep the phrases of the level before */ }
  r.fetching = false;
  if (run !== r || r.phase !== 'review') return;
  r.phrases = phrases;
  memorize();
}

/* ---------- the end of a session: the three averages ---------- */
function finish() {
  const r = run;
  if (!r) return;
  run = null;
  clearInterval(r.tick);
  clearTimeout(r.phaseT);
  clearTimeout(r.swapT);
  cancelAnimationFrame(r.frame);
  $('window').replaceChildren();
  $('field').replaceChildren();
  $('phrase').textContent = '';
  $('source').replaceChildren();
  view = r.rounds.length ? 'results' : 'setup';            // stopped before a round was finished: straight back to the first screen
  if (r.rounds.length) {
    const exact = r.rounds.every((x) => x.result.percent === 100);
    showScore($('avg-accuracy'), exact ? 100 : Math.min(99, Math.round(100 * mean(r.rounds.map((x) => x.result.value)))));
    $('avg-recall').textContent = span(mean(r.rounds.map((x) => x.recallMs)));
    $('avg-sphere').textContent = span(mean(r.rounds.map((x) => x.sphereMs)));
    $('ended').hidden = r.sea === r.from.sea && r.wm === r.from.wm;     // said only if the session moved the difficulty
    $('ended-at').textContent = levelsText(r);
  }
  if (r.sea !== set.sea || r.wm !== set.wm) {              // the next session starts where this one left the difficulty
    set.sea = r.sea;
    set.wm = r.wm;
    showLevels();
    remember();
    survey();
  }
  draw();
}

/* ---------- wiring ---------- */
const remember = () => keep.write('axiom.settings', { v: 2, kinds: set.kinds, sea: set.sea, wm: set.wm, pics: set.pics, minutes: $('session-min').value, memo: $('memo-sec').value });
function showLevels() {                                    // each square on its level, with the level written in it
  for (const key of ['sea', 'wm']) {
    const box = $(key + '-levels'), input = box.querySelector('input');
    input.value = set[key];
    input.setAttribute('aria-valuetext', 'Level ' + set[key] + ' of ' + TOP[key]);
    box.querySelector('.knob').textContent = set[key];
    box.style.setProperty('--at', (set[key] - 1) / (TOP[key] - 1));
  }
}
const showKinds = () => $('modes').querySelectorAll('input').forEach((i) => { i.checked = set.kinds.includes(i.value); });
$('modes').addEventListener('change', (e) => {         // any number of categories from one to five; the last one on stays on
  const on = [...$('modes').querySelectorAll('input:checked')].map((i) => i.value);
  if (!on.length) { e.target.checked = true; return; }
  set.kinds = kindsOf(on);
  remember();
  survey();
});
for (const key of ['sea', 'wm']) {
  const box = $(key + '-levels'), top = TOP[key];
  box.innerHTML = Array.from({ length: top }, (_, i) => '<span class="tick" style="--i:' + i / (top - 1) + '"></span>').join('')
    + '<input type="range" name="' + key + '" min="1" max="' + top + '" step="1" value="1" aria-label="' + $(key + '-name').textContent + ' level">'
    + '<span class="knob" aria-hidden="true">1</span>';
  box.addEventListener('input', (e) => {                   // dragged, tapped or moved with the arrow keys
    set[key] = +e.target.value;
    showLevels();
    remember();
    survey();
  });
}
$('pics-toggle').addEventListener('change', (e) => { set.pics = e.target.value === 'on'; remember(); });
$('session-min').addEventListener('input', remember);
$('memo-sec').addEventListener('input', remember);
/* a time field is as wide as its digits, and the two are always the same size: if a long number would push its unit
   out of its column, both get smaller together until everything fits */
function fitTime() {
  const boxes = [$('memo-sec'), $('session-min')];
  for (const box of boxes) {
    box.style.fontSize = '';
    box.style.width = Math.max(1, Array.from(box.value || box.placeholder).reduce((w, ch) => w + (/[.,]/.test(ch) ? 0.45 : 1), 0)) + 0.15 + 'ch';
  }
  const over = () => boxes.some((box) => box.parentNode.scrollWidth > box.parentNode.clientWidth + 0.5);
  for (let size = parseFloat(getComputedStyle(boxes[0]).fontSize); over() && size > 24; size -= 2) boxes.forEach((box) => { box.style.fontSize = size - 2 + 'px'; });
}
for (const id of ['memo-sec', 'session-min']) $(id).addEventListener('input', fitTime);
/* Selecting either number empties it, ready for the new one; the old number shows faintly until something is typed.
   Leaving it empty puts the old number back. */
for (const id of ['memo-sec', 'session-min']) {
  const box = $(id);
  box.addEventListener('focus', () => {
    box.dataset.was = box.value;
    box.placeholder = box.value;
    box.value = '';
    fitTime();
  });
  box.addEventListener('blur', () => {
    if (!box.value.trim() && box.dataset.was) { box.value = box.dataset.was; remember(); }
    box.placeholder = '';
    fitTime();
  });
}
addEventListener('resize', fitTime);
/* Start and Submit are plain buttons, not forms: a page shown inside a sandboxed preview is not allowed to submit one */
function begin() {
  start().catch((e) => {                                   // if anything stops a session from starting, say what, never nothing
    run = null;
    view = 'setup';
    draw();
    $('note').textContent = 'The session could not start: ' + (e && e.message ? e.message : e);
  });
}
$('go').addEventListener('click', begin);
for (const id of ['session-min', 'memo-sec']) $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); begin(); } });
$('stop').addEventListener('click', finish);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && run) finish(); });
$('field').addEventListener('click', (e) => { const orb = e.target.closest('.orb'); if (orb) pressSphere(orb); });
$('submit').addEventListener('click', submit);
$('answer').addEventListener('input', fitBox);
$('answer').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.isComposing) return;
  e.preventDefault();                                      // a phrase is one line: Enter hands it in, and an empty box is not handed in by accident
  if ($('answer').value.trim()) submit();
});
$('next').addEventListener('click', onward);
document.addEventListener('keydown', (e) => {              // Enter also moves on, but not the Enter that has just handed in the rewrite
  if (e.key === 'Enter' && !e.repeat && run && run.phase === 'review' && now() - run.shownAt > 500) { e.preventDefault(); onward(); }
});
$('again').addEventListener('click', () => { view = 'setup'; draw(); fitTime(); });

const saved = keep.read('axiom.settings') || {};
set.kinds = kindsOf(saved.kinds);
showKinds();
if (saved.v !== 2 && Number.isInteger(saved.sea)) saved.sea = seaFromOld(saved.sea);   // saved when selective attention had ten levels
for (const key of ['sea', 'wm']) if (Number.isInteger(saved[key]) && saved[key] >= 1 && saved[key] <= TOP[key]) set[key] = saved[key];
showLevels();
set.pics = saved.pics === true;
$('pics-toggle').querySelector('input[value="' + (set.pics ? 'on' : 'off') + '"]').checked = true;
if (parseFloat(saved.minutes) > 0) $('session-min').value = saved.minutes;
if (memorizeSeconds(saved.memo)) $('memo-sec').value = saved.memo;
fitTime();
draw();
survey();
setTimeout(loadMeaning, 800);                              // in the background, so the first segment does not wait for it
})();
</script>
</body>
</html>
